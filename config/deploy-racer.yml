# Name of your application. Used to uniquely configure containers.
service: racer

# Name of the container image.
image: <%= ENV["DOCKER_RACER_IMAGE_NAME"] %>

# Deploy to the same server as the main site.
servers:
  web:
    - <%= ENV["HOSTING_SERVER_IP"] %>

# Enable SSL auto certification via Let's Encrypt.
# The racer gets its own subdomain on the same host.
proxy:
  ssl: true
  hosts:
    - <%= ENV["RACER_PUBLIC_DOMAIN"] %>
  app_port: 1338
  healthcheck:
    path: /healthz

# Credentials for your image host.
registry:
  username: <%= ENV["DOCKER_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  # Build context is the repo root so the pnpm workspace is available
  context: .
  dockerfile: packages/racer/Dockerfile
  # Bust the source-code cache on every deploy so code changes always ship
  args:
    CACHEBUST: <%= Time.now.to_i %>

# Inject ENV variables into containers.
# No secrets required — the leaderboard is a local sqlite file.
env:
  clear:
    PORT: 1338
    DB_FILE: /data/leaderboard.sqlite

# The leaderboard is the only state that has to outlive the container;
# without this volume every deploy would start the event over.
volumes:
  - "racer_data:/data"
